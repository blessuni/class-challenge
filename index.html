<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리 반 오늘의 도전</title>
<style>
:root{--bg:#fffaf1;--ink:#24334b;--pink:#ff7fa6;--yellow:#ffd96a;--green:#79cfa8;--blue:#76b9f5;--muted:#e9edf3}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:linear-gradient(180deg,#fff9e9,#f7fbff);color:var(--ink)}
.wrap{max-width:1050px;margin:auto;padding:52px 20px 24px}.hero{text-align:center;padding:12px 8px}.hero .kicker{font-weight:850;color:#f08a42;font-size:clamp(16px,2vw,20px)}.hero h1{font-size:clamp(34px,6vw,62px);margin:5px 0 6px}.hero p{font-size:clamp(17px,2.5vw,25px);margin:0;color:#5d6878;line-height:1.45}
.progress{background:#fff;border-radius:24px;padding:14px 18px;margin:18px 0;box-shadow:0 6px 20px #455a6412;display:flex;gap:14px;align-items:center}.bar{height:18px;background:#eef2f6;border-radius:99px;overflow:hidden;flex:1}.fill{height:100%;background:linear-gradient(90deg,var(--yellow),var(--pink));width:0;transition:.3s}.count{font-weight:900;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.name{min-height:88px;border:0;border-radius:24px;background:#fff;box-shadow:0 5px 15px #455a6415;font-size:clamp(21px,3vw,30px);font-weight:900;color:var(--ink);cursor:pointer;transition:.15s;padding:10px}.name:active{transform:scale(.97)}.name.done{background:#e9f9ef;color:#287a4d;box-shadow:inset 0 0 0 3px #9fe0b7}.name.done::after{content:" ✓"}
.teacherBtn{position:fixed;right:18px;top:18px;z-index:30;border:0;border-radius:99px;background:#24334b;color:#fff;padding:12px 16px;font-weight:800;opacity:.9}.panel{display:none;position:fixed;inset:0;background:#f7f9fc;z-index:20;overflow:auto}.panel.show{display:block}.panel .inner{max-width:900px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{border:0;border-radius:12px;padding:10px 14px;background:#e8edf4;font-weight:800}.settings{background:#fff;padding:18px;border-radius:20px;margin:16px 0;box-shadow:0 5px 18px #455a6412}.settings label{font-weight:800;display:block;margin:12px 0 5px}.settings input,.settings textarea{width:100%;font-size:17px;padding:12px;border:2px solid #e4e8ee;border-radius:12px;font-family:inherit}.settings textarea{min-height:160px;resize:vertical;line-height:1.55}.settings input[type=number]{max-width:180px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.action{border:0;border-radius:14px;padding:12px 16px;font-weight:900;font-size:16px;background:#24334b;color:#fff;cursor:pointer}.danger{background:#d95858}.secondary{background:#718096}.statusGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.status{background:#fff;border-radius:12px;padding:11px 14px;font-weight:750}.status.done{background:#e9f9ef;color:#287a4d}.total{font-size:13px;color:#6b7788;margin-left:7px}.note{font-size:14px;color:#6b7481;line-height:1.55;background:#fff8d9;padding:12px;border-radius:12px;margin-top:12px}.hint{font-size:13px;color:#687386;margin-top:6px}.overlay{position:fixed;inset:0;background:#ffffffed;display:none;align-items:center;justify-content:center;z-index:10;text-align:center;padding:20px}.overlay.show{display:flex}.celebrate{font-size:clamp(30px,6vw,62px);font-weight:950}.celebrate .emoji{font-size:1.4em}.privacy{position:fixed;left:12px;bottom:10px;background:#ffffffd9;border-radius:99px;padding:6px 10px;font-size:11px;color:#667085}
@media(max-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.name{min-height:76px}.wrap{padding:14px}}@media(max-width:430px){.grid{grid-template-columns:repeat(2,1fr)}.statusGrid{grid-template-columns:1fr}}
</style></head>
<body>
<div class="wrap"><div class="hero"><div class="kicker" id="classKicker">우리 반 오늘의 도전 🌟</div><h1 id="title">오늘의 도전! 😊</h1><p id="prompt">도전을 완료했다면 내 이름을 눌러주세요!</p></div>
<div class="progress"><div class="bar"><div class="fill" id="fill"></div></div><div class="count" id="count">0 / 8</div></div><div class="grid" id="grid"></div></div>
<button class="teacherBtn" id="teacherBtn">⚙ 교사용 설정</button><div class="privacy">시연용 · 입력한 정보는 현재 기기에만 저장됩니다</div>
<div class="overlay" id="overlay"><div class="celebrate"><div class="emoji">🌟👏💎</div><div id="celebrateText"></div></div></div>
<div class="panel" id="panel"><div class="inner"><div class="top"><div><h2 style="margin:0">교사용 설정</h2><div id="teacherCount"></div></div><button class="close" id="close">아이 화면으로</button></div>
<div class="settings">
<label>반 이름</label><input id="setClass" maxlength="30" placeholder="예: 다이아몬드반">
<label>유아 수</label><input id="setCount" type="number" min="1" max="60" value="8"><div class="hint">인원수를 바꾸면 이름 목록을 새 인원수에 맞춰 조정할 수 있어요.</div>
<label>유아 이름 (한 줄에 한 명씩)</label><textarea id="setNames" placeholder="친구 1&#10;친구 2&#10;친구 3"></textarea><div class="row" style="margin-top:8px"><button class="action secondary" id="makeNames">인원수에 맞춰 예시 이름 만들기</button></div>
<label>활동 제목</label><input id="setTitle" maxlength="80" placeholder="예: 오늘의 도전! 😊">
<label>아이들에게 보여줄 안내 문구</label><input id="setPrompt" maxlength="200" placeholder="도전을 완료했다면 내 이름을 눌러주세요!">
<label>이름을 눌렀을 때 성공 문구</label><input id="setSuccess" maxlength="100" placeholder="해냈어요!">
<div class="row"><button class="action" id="saveSettings">설정 저장하기</button><button class="action danger" id="reset">오늘 기록 초기화</button><button class="action secondary" id="resetAll">설정까지 처음으로</button></div>
<div class="note">이 앱은 선생님 시연용으로 별도 제작되었습니다. 기존 다이아몬드반 실제 앱과 연결되지 않으며, 반 이름·유아 이름·활동 기록은 이 기기의 브라우저에만 저장됩니다. 여러 기기 간 실시간 공유는 하지 않습니다.</div>
</div><div class="note">완료 표시를 취소하려면 아래 명단에서 해당 유아의 취소 버튼을 눌러주세요.</div><div class="statusGrid" id="statusGrid"></div></div></div>
<script>
let audioCtx=null;function audio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(e){return null}}
function tone(freq,start,duration,gain=.05,type='sine'){const c=audio();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,c.currentTime+start);g.gain.setValueAtTime(.0001,c.currentTime+start);g.gain.exponentialRampToValueAtTime(gain,c.currentTime+start+.008);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+start+duration);o.connect(g);g.connect(c.destination);o.start(c.currentTime+start);o.stop(c.currentTime+start+duration+.02)}
function playClick(){tone(720,0,.055,.045);tone(980,.045,.07,.035)}function playApplause(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.075,.22,.045,'triangle'))}
const KEY='our-class-todays-challenge-demo-v1';const defaults={className:'우리 반',names:Array.from({length:8},(_,i)=>`친구 ${i+1}`),title:'오늘의 도전! 😊',prompt:'도전을 완료했다면 내 이름을 눌러주세요!',success:'해냈어요!',done:{},totals:{}};
let state={...defaults};try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved)state={...defaults,...saved}}catch(e){}
const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(state))}function cleanNames(){return state.names.map(n=>String(n).trim()).filter(Boolean)}
function render(){const names=cleanNames();$('classKicker').textContent=`${state.className||'우리 반'} 오늘의 도전 🌟`;$('title').textContent=state.title;$('prompt').textContent=state.prompt;$('grid').innerHTML='';$('statusGrid').innerHTML='';names.forEach(n=>{const b=document.createElement('button');b.className='name'+(state.done[n]?' done':'');b.textContent=n;b.onclick=()=>complete(n);$('grid').appendChild(b);const s=document.createElement('div');s.className='status'+(state.done[n]?' done':'');const label=document.createElement('span');label.textContent=(state.done[n]?'✓ ':'○ ')+n;const total=document.createElement('span');total.className='total';total.textContent=`누적 ${Number(state.totals[n]||0)}회`;label.appendChild(total);const btn=document.createElement('button');btn.textContent=state.done[n]?'↩ 취소':'✓ 완료';btn.style.cssText='float:right;border:0;border-radius:9px;padding:6px 10px;font-weight:900;cursor:pointer;background:'+(state.done[n]?'#ffe2e2':'#e4f5ea')+';color:'+(state.done[n]?'#b53b3b':'#287a4d');btn.onclick=()=>toggle(n);s.append(label,btn);$('statusGrid').appendChild(s)});const c=names.filter(n=>state.done[n]).length;$('count').textContent=`${c} / ${names.length}`;$('teacherCount').textContent=`${state.className} · ${names.length}명 중 ${c}명 완료`;$('fill').style.width=(names.length?c/names.length*100:0)+'%'}
function complete(n){playClick();if(state.done[n]){if(confirm(`${n}의 완료 표시를 취소할까요?`)){delete state.done[n];state.totals[n]=Math.max(0,Number(state.totals[n]||0)-1);save();render()}return}state.done[n]=true;state.totals[n]=Number(state.totals[n]||0)+1;save();render();playApplause();$('celebrateText').textContent=`${n} ${state.success}`;$('overlay').classList.add('show');setTimeout(()=>$('overlay').classList.remove('show'),1600)}
function toggle(n){if(state.done[n]){if(confirm(`${n}의 오늘 완료를 취소할까요?`)){delete state.done[n];state.totals[n]=Math.max(0,Number(state.totals[n]||0)-1)}}else{if(confirm(`${n}을 완료로 표시할까요?`)){state.done[n]=true;state.totals[n]=Number(state.totals[n]||0)+1}}save();render()}
function fillSettings(){$('setClass').value=state.className;$('setCount').value=state.names.length;$('setNames').value=state.names.join('\n');$('setTitle').value=state.title;$('setPrompt').value=state.prompt;$('setSuccess').value=state.success}
$('teacherBtn').onclick=()=>{$('panel').classList.add('show');fillSettings();render()};$('close').onclick=()=>$('panel').classList.remove('show');
$('makeNames').onclick=()=>{const n=Math.max(1,Math.min(60,Number($('setCount').value)||1));$('setNames').value=Array.from({length:n},(_,i)=>`친구 ${i+1}`).join('\n')};
$('saveSettings').onclick=()=>{const count=Math.max(1,Math.min(60,Number($('setCount').value)||1));let names=$('setNames').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(names.length===0)names=Array.from({length:count},(_,i)=>`친구 ${i+1}`);if(names.length!==count){alert(`유아 수는 ${count}명인데 이름은 ${names.length}개예요. 인원수와 이름 개수를 맞춰주세요.`);return}if(new Set(names).size!==names.length){alert('같은 이름이 중복되어 있어요. 이름을 확인해 주세요.');return}const oldNames=state.names;const nextTotals={};names.forEach(n=>nextTotals[n]=state.totals[n]||0);const nextDone={};names.forEach(n=>{if(state.done[n])nextDone[n]=true});state={...state,className:$('setClass').value.trim()||'우리 반',names,title:$('setTitle').value.trim()||'오늘의 도전! 😊',prompt:$('setPrompt').value.trim()||'도전을 완료했다면 내 이름을 눌러주세요!',success:$('setSuccess').value.trim()||'해냈어요!',done:nextDone,totals:nextTotals};save();render();alert('설정을 저장했어요!')};
$('reset').onclick=()=>{if(confirm('오늘 완료 표시를 모두 초기화할까요? 누적 횟수는 유지됩니다.')){state.done={};save();render()}};$('resetAll').onclick=()=>{if(confirm('반 이름, 유아 명단, 활동 문구와 기록을 모두 기본값으로 되돌릴까요?')){state={...defaults,names:[...defaults.names],done:{},totals:{}};save();fillSettings();render()}};
render();
</script></body></html>
